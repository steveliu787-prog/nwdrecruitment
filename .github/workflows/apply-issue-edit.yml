name: Apply inline site edit

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: site-edit-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: |
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'content-edit:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply editor payload
        run: node .github/scripts/apply-issue-edit.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ toJson(github.event.issue.body) }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Close request issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --reason completed
